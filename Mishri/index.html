<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Gurl!</title>
    <style>
        /* Saari styling wahi rahegi jo aapne di thi */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', cursive, sans-serif; }
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .container { text-align: center; z-index: 10; padding: 2rem; max-width: 800px; background-color: rgba(255, 255, 255, 0.2); border-radius: 20px; backdrop-filter: blur(5px); box-shadow: 0 8px 32px rgba(255, 105, 180, 0.3); transition: all 0.5s ease; }
        h1 { font-size: 3.5rem; color: #FF1493; margin-bottom: 1.5rem; opacity: 0; animation: bounce-in 1.5s forwards 0.5s; }
        .subtitle { font-size: 1.8rem; color: #8A2BE2; margin-bottom: 2rem; opacity: 0; }
        .next-button { padding: 1rem 3rem; font-size: 1.5rem; background: linear-gradient(45deg, #FF1493, #8A2BE2); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.5); transition: all 0.3s ease; opacity: 0; animation: fade-in 1s forwards 3s; }
        
        /* Animations */
        @keyframes bounce-in { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes typewriter { from { width: 0; } to { width: 100%; } }
        
        .typewriter-container { display: inline-block; overflow: hidden; height: 2.5rem; }
        .typewriter-text { white-space: nowrap; overflow: hidden; width: 0; animation: typewriter 3s steps(50) forwards 1.5s; opacity: 1 !important; }
        
        /* Floating elements styles */
        .confetti, .balloon, .heart, .star { position: absolute; z-index: 1; opacity: 0.8; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="main-heading">Happy Birthday, <br>My Gurl! <br>🎉🎂</h1>
        <div class="typewriter-container">
            <div class="subtitle typewriter-text">
                Hey jaan! Ready for your special surprise ?
            </div>
        </div>
        <br>
        <button class="next-button" onclick="goToNextPage()">Let's Go! ✨</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script>
        // Navigation
        function goToNextPage() {
            gsap.to('.next-button', {
                scale: 1.2,
                yoyo: true,
                repeat: 1,
                duration: 0.3,
                onComplete: () => {
                    window.location.href = "memorylane.html";
                }
            });
        }

        // Floating Elements Logic (Confetti, Balloons etc.)
        function createFloatingElements() {
            const colors = ['#FF1493', '#8A2BE2', '#FFD700', '#FF4500', '#00BFFF', '#32CD32'];
            const elements = ['🎈', '❤️', '✨', '🌸'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.innerHTML = elements[Math.floor(Math.random() * elements.length)];
                    el.style.position = 'fixed';
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.top = '-50px';
                    el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    el.style.zIndex = '1';
                    document.body.appendChild(el);

                    gsap.to(el, {
                        y: window.innerHeight + 100,
                        x: '+=' + (Math.random() * 200 - 100),
                        rotation: Math.random() * 360,
                        duration: Math.random() * 5 + 5,
                        ease: "none",
                        onComplete: () => el.remove()
                    });
                }, i * 300);
            }
        }

        window.addEventListener('load', createFloatingElements);
        setInterval(createFloatingElements, 10000);

        // Heading Sparkle Effect
        gsap.to('#main-heading', {
            textShadow: "0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 20, 147, 0.6)",
            repeat: -1,
            yoyo: true,
            duration: 2
        });
    </script>
</body>
</html>
